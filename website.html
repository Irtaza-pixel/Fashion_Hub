<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FashionHub | 50+ Premium Collection</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --dark: #1a1a1a;
            --light: #f8f9fa;
            --success: #28a745;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #fff;
            color: var(--dark);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* --- NAVIGATION --- */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            z-index: 1000;
            padding: 1rem 0;
            box-shadow: 0 2px 20px rgba(0,0,0,0.05);
        }

        .nav-container {
            max-width: 1300px;
            margin: 0 auto;padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--dark);
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-links a:hover { color: var(--primary); }

        .cart-trigger {
            background: var(--dark);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            transition: 0.3s;
        }

        .cart-trigger:hover { transform: scale(1.05); background: var(--primary); }

        #cart-count {
            background: #ff4757;
            padding: 2px 7px;
            border-radius: 50%;
            font-size: 12px;
        }

        /* --- HERO SECTION --- */
        .hero {
            height: 80vh;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            margin-top: 60px;
        }

        .hero h1 { font-size: 4rem; margin-bottom: 15px; }

        /* --- SHOP SECTION --- */
        .shop-section {
            max-width: 1300px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .filter-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 25px;
            border-radius: 25px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 35px;
        }

        /* --- PRODUCT CARDS --- */
        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid #eee;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .img-holder {
            height: 350px;
            overflow: hidden;
            background: #f1f1f1;
        }

        .img-holder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }

        .product-card:hover .img-holder img { transform: scale(1.1); }

        .product-info { padding: 20px; }
        .p-cat { font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 5px; }
        .p-title { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
        .p-price { font-size: 20px; color: var(--primary); font-weight: 700; }

        .add-btn {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: var(--dark);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .add-btn:hover { background: var(--primary); }

        /* --- CART SIDEBAR --- */
        .cart-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 2000; display: none;
        }

        .cart-sidebar {
            position: fixed; right: -450px; top: 0; width: 400px; height: 100%;
            background: white; z-index: 2001; transition: 0.4s;
            padding: 30px; display: flex; flex-direction: column;
        }

        .cart-sidebar.active { right: 0; }

        .cart-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #eee; padding-bottom: 20px; margin-bottom: 20px;
        }

        .cart-items-list { flex-grow: 1; overflow-y: auto; }

        .cart-item {
            display: flex; gap: 15px; margin-bottom: 20px; align-items: center;
            border-bottom: 1px dotted #eee; padding-bottom: 10px;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .cart-sidebar { width: 100%; right: -100%; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="logo">FashionHub</a>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#shop">Shop</a></li>
            </ul>
            <button class="cart-trigger" onclick="toggleCart()">
                <i class="fas fa-shopping-bag"></i>
                <span id="cart-count">0</span>
            </button>
        </div>
    </nav>

    <section id="home" class="hero">
        <div data-aos="zoom-out" data-aos-duration="1000">
            <h1>New Season Style</h1>
            <p>Explore 50+ New Essentials for Men & Women</p>
        </div>
    </section>

    <section id="shop" class="shop-section">
        <div class="filter-container">
            <button class="filter-btn active" onclick="filterData('all')">All Products</button>
            <button class="filter-btn" onclick="filterData('shirt')">Shirts</button>
            <button class="filter-btn" onclick="filterData('pants')">Pants</button>
            <button class="filter-btn" onclick="filterData('shoes')">Shoes</button>
            <button class="filter-btn" onclick="filterData('underwear')">Underwear</button>
        </div>

        <div class="product-grid" id="main-grid">
            </div>
    </section>

    <div class="cart-overlay" id="overlay" onclick="toggleCart()"></div>
    <div class="cart-sidebar" id="sidebar">
        <div class="cart-header">
            <h2>Your Bag</h2>
            <button onclick="toggleCart()" style="background:none; border:none; font-size:24px; cursor:pointer;">&times;</button>
        </div>
        <div class="cart-items-list" id="cart-content">
            </div>
        <div style="padding-top:20px; border-top: 2px solid #eee;">
            <h3 style="display:flex; justify-content:space-between;">Total: <span id="total-price">$0.00</span></h3>
            <button class="add-btn" style="background:var(--primary); font-size:18px;">Checkout Now</button>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();

        // 1. DATA GENERATION (50+ Items)
        const catIcons = {
            shirt: "https://images.unsplash.com/photo-1581655353564-df123a1eb820?w=600&q=80",
            pants: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=600&q=80",
            shoes: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600&q=80",
            underwear: "https://images.unsplash.com/photo-1583993411520-d13067756f77?w=600&q=80"
        };

        const colors = ["Slate", "Arctic", "Midnight", "Desert", "Olive", "Crimson", "Royal Blue", "Shadow"];
        const products = [];

        // Create 52 products
        for(let i=1; i<=52; i++) {
            const keys = Object.keys(catIcons);
            const category = keys[i % keys.length];
            const color = colors[i % colors.length];
            
            products.push({
                id: i,
                name: `${color} ${category.charAt(0).toUpperCase() + category.slice(1)}`,
                category: category,
                price: (Math.random() * (120 - 15) + 15).toFixed(2),
                image: catIcons[category]
            });
        }

        // 2. RENDER LOGIC
        const grid = document.getElementById('main-grid');
        let cart = [];

        function render(items) {
            grid.innerHTML = '';
            items.forEach((p, index) => {
                grid.innerHTML += `
                    <div class="product-card" data-aos="fade-up" data-aos-delay="${(index % 4) * 50}">
                        <div class="img-holder">
                            <img src="${p.image}" alt="${p.name}" onerror="this.src='https://images.unsplash.com/photo-1523381210434-271e8be1f52b?w=600&q=80'">
                        </div>
                        <div class="product-info">
                            <p class="p-cat">${p.category}</p>
                            <h3 class="p-title">${p.name}</h3>
                            <p class="p-price">$${p.price}</p>
                            <button class="add-btn" onclick="addToCart(${p.id})">Add To Cart</button>
                        </div>
                    </div>
                `;
            });
        }

        function filterData(cat) {
            // Update Buttons
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // Filter Data
            if(cat === 'all') render(products);
            else render(products.filter(p => p.category === cat));
        }

        // 3. CART LOGIC
        function toggleCart() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').style.display = 
                (document.getElementById('overlay').style.display === 'block') ? 'none' : 'block';
        }

        function addToCart(id) {
            const item = products.find(p => p.id === id);
            cart.push(item);
            updateCartUI();
            
            // Notification effect on button
            const btn = event.target;
            btn.innerText = "Added ✓";
            btn.style.background = "#28a745";
            setTimeout(() => {
                btn.innerText = "Add To Cart";
                btn.style.background = "#1a1a1a";
            }, 800);
        }

        function updateCartUI() {
            const container = document.getElementById('cart-content');
            const count = document.getElementById('cart-count');
            const totalDisplay = document.getElementById('total-price');
            
            count.innerText = cart.length;
            
            if(cart.length === 0) {
                container.innerHTML = '<p style="text-align:center; margin-top:50px; color:#888;">Bag is empty</p>';
                totalDisplay.innerText = '$0.00';
                return;
            }

            let total = 0;
            container.innerHTML = cart.map((item, index) => {
                total += parseFloat(item.price);
                return `
                    <div class="cart-item">
                        <img src="${item.image}" style="width:60px; height:60px; object-fit:cover; border-radius:8px;">
                        <div style="flex-grow:1">
                            <h4 style="font-size:14px">${item.name}</h4>
                            <p style="color:var(--primary); font-weight:bold">$${item.price}</p>
                        </div>
                        <button onclick="remove(${index})" style="color:red; background:none; border:none; cursor:pointer;"><i class="fas fa-trash"></i></button>
                    </div>
                `;
            }).join('');

            totalDisplay.innerText = `$${total.toFixed(2)}`;
        }

        function remove(idx) {
            cart.splice(idx, 1);
            updateCartUI();
        }

        // Initial Load
        render(products);
    </script>
</body>
</html>
